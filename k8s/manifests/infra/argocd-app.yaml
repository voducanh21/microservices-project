apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-app
  namespace: argocd  # Namespace của ArgoCD
spec:
  project: default
  source:
    repoURL: https://github.com/voducanh21/microservices-project.git
    targetRevision: HEAD
    path: k8s/manifests/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true       
    syncOptions:
      - CreateNamespace=true
